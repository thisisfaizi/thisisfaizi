# Renders the language-breakdown and contribution-calendar cards INTO this repo,
# so the profile never shows a broken image when a third-party host goes down.
#
# PREREQUISITE — this workflow cannot run without it:
#   lowlighter/metrics requires a *personal access token*; the automatic
#   ${{ secrets.GITHUB_TOKEN }} is explicitly not accepted, because the action
#   reads user-level data that a repo-scoped token cannot see.
#
#   1. github.com/settings/tokens -> generate a classic token.
#      No scopes needed for public data; tick `repo` to include private repos
#      in the language breakdown (which is where most of the work is).
#   2. This repo -> Settings -> Secrets and variables -> Actions ->
#      New repository secret, named METRICS_TOKEN.
#   3. Actions tab -> "Profile metrics" -> Run workflow.
#   4. Once the two SVGs are committed, uncomment the matching <img> tags
#      in README.md.
name: Profile metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  # No `push` trigger on purpose: this job commits back to the default branch,
  # which would re-trigger itself in a loop.

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Language breakdown
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: thisisfaizi
          filename: metrics.plugin.languages.details.svg
          base: ""
          config_timezone: Asia/Karachi
          plugins_errors_fatal: no
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

      - name: Contribution calendar
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: thisisfaizi
          filename: metrics.plugin.isocalendar.svg
          base: ""
          config_timezone: Asia/Karachi
          plugins_errors_fatal: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
